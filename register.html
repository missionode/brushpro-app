<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrushPro - Register</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen font-sans antialiased">
    <div class="max-w-md w-full mx-auto bg-white p-8 rounded-lg shadow-lg">
        <div class="text-center mb-6">
            <a href="login.html" class="inline-flex items-center text-purple-700 hover:text-purple-900 transition duration-200">
                <svg class="w-8 h-8 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-2.414-2.414A1 1 0 0015.586 6H7a2 2 0 00-2 2v11a2 2 0 002 2z"></path></svg>
                <span class="text-3xl font-bold">BrushPro</span>
            </a>
            <h2 class="text-2xl font-bold text-gray-800 mt-4">Create Your Account</h2>
            <p class="text-gray-600">Join BrushPro and get started with your painting needs or services.</p>
        </div>

        <form id="registrationForm" class="space-y-5">
            <div>
                <label for="fullName" class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                <input type="text" id="fullName" name="fullName" placeholder="John Doe" required
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500">
            </div>
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500">
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500">
            </div>
            <div>
                <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-1">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="••••••••" required
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500">
            </div>
            <div>
                <label for="accountType" class="block text-sm font-medium text-gray-700 mb-1">Account Type</label>
                <select id="accountType" name="accountType" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500">
                    <option value="">Select Account Type</option>
                    <option value="client">Client (Need a painter)</option>
                    <option value="painter">Painter (Offer painting services)</option>
                </select>
            </div>
            
            <button type="submit"
                    class="w-full bg-purple-600 hover:bg-purple-700 text-white font-semibold py-3 px-4 rounded-lg transition duration-200 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:ring-offset-2">
                Register
            </button>
        </form>

        <p class="text-center text-gray-600 text-sm mt-6">
            Already have an account? <a href="login.html" class="text-purple-600 hover:text-purple-800 font-medium">Login here</a>
        </p>

        <p class="text-center text-gray-500 text-xs mt-4">
            By registering, you agree to our <a href="shared/shared_help_support.html" class="text-purple-600 hover:text-purple-800">Terms of Service</a> and <a href="#" class="text-purple-600 hover:text-purple-800">Privacy Policy</a>.
        </p>
    </div>

    <script src="assets/js/main.js"></script>
    <script>
        document.getElementById('registrationForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const fullName = document.getElementById('fullName').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const accountType = document.getElementById('accountType').value;

            if (password !== confirmPassword) {
                alert('Passwords do not match!');
                return;
            }

            if (accountType === '') {
                alert('Please select an account type!');
                return;
            }

            // In a real application, you would send this data to a server
            console.log('Registration attempt:', {
                fullName,
                email,
                accountType,
                // password is not usually logged for security reasons
            });

            alert(`Registration successful for ${fullName} as a ${accountType}!\n(Redirecting to dashboard for ${accountType}).`);
            
            // Simulate redirection based on account type
            if (accountType === 'client') {
                window.location.href = 'client/client_dashboard.html';
            } else if (accountType === 'painter') {
                window.location.href = 'painter/painter_dashboard.html';
            }
        });
    </script>
</body>
</html>
