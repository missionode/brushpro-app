<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrushPro - Forgot Password</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased flex items-center justify-center min-h-screen p-4">

    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
        <div class="text-center mb-8">
            <a href="index.html" class="text-3xl font-bold text-blue-600 flex items-center justify-center mb-4">
                <svg class="w-8 h-8 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-2.414-2.414A1 1 0 0015.586 6H7a2 2 0 00-2 2v11a2 2 0 002 2z"></path></svg>
                BrushPro
            </a>
            <h2 class="text-2xl font-semibold text-gray-800">Reset Your Password</h2>
            <p class="text-gray-600 mt-2">Enter your email address and we'll send you a link to reset your password.</p>
        </div>
        
        <form id="forgotPasswordForm" class="space-y-6">
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                <input type="email" id="email" name="email" required 
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                       placeholder="you@example.com">
            </div>
            
            <div>
                <button type="submit" 
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg transition duration-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                    Send Reset Link
                </button>
            </div>
        </form>

        <p class="mt-8 text-center text-sm text-gray-600">
            Remember your password? 
            <a href="login.html" class="font-medium text-blue-600 hover:text-blue-500">Login here</a>
        </p>
    </div>

    <script src="assets/js/main.js"></script>
    <script>
        document.getElementById('forgotPasswordForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;

            // In a real application, you would send this email to a backend server
            // which would then generate a password reset token and send an email to the user.
            console.log('Password reset request for:', email);

            alert(`If an account with "${email}" exists, a password reset link has been sent to your email address.`);
            
            // Optionally redirect to a confirmation page or login page
            // window.location.href = 'login.html'; 
        });
    </script>
</body>
</html>
