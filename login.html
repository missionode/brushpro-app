<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrushPro - Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased flex items-center justify-center min-h-screen p-4">

    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
        <div class="text-center mb-8">
            <a href="index.html" class="text-3xl font-bold text-blue-600 flex items-center justify-center mb-4">
                <svg class="w-8 h-8 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-2.414-2.414A1 1 0 0015.586 6H7a2 2 0 00-2 2v11a2 2 0 002 2z"></path></svg>
                BrushPro
            </a>
            <h2 class="text-2xl font-semibold text-gray-800">Login to Your Account</h2>
        </div>
        
        <form id="loginForm" class="space-y-6">
            <div>
                <label for="userType" class="block text-sm font-medium text-gray-700 mb-1">I am a...</label>
                <select id="userType" name="userType" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="client" selected>Client</option>
                    <option value="painter">Painter</option>
                    <option value="admin">Admin</option>
                </select>
            </div>
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                <input type="email" id="email" value="you@example.com" name="email" required 
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                       placeholder="you@example.com">
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" id="password" value="yourpassword" name="password" required 
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                       placeholder="••••••••">
            </div>
            
            <div class="flex items-center justify-between text-sm">
                <div class="flex items-center">
                    <input id="remember_me" name="remember_me" type="checkbox" 
                           class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
                    <label for="remember_me" class="ml-2 block text-gray-700">Remember me</label>
                </div>
                <a href="forgot_password.html" class="font-medium text-blue-600 hover:text-blue-500">Forgot your password?</a>
            </div>
            
            <div>
                <button type="submit" 
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg transition duration-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                    Login
                </button>
            </div>
        </form>

        <p class="mt-8 text-center text-sm text-gray-600">
            Don't have an account? 
            <a href="register.html" class="font-medium text-blue-600 hover:text-blue-500">Register here</a>
        </p>
    </div>

    <script src="assets/js/main.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const userType = document.getElementById('userType').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // In a real app, you would validate email and password against a database
            // and then redirect based on the user type.
            console.log('Login attempt:', { userType, email, password });

            // For now, we'll just redirect to the correct dashboard based on the dropdown selection.
            let dashboardUrl = '';
            if (userType === 'client') {
                dashboardUrl = 'client/client_dashboard.html';
            } else if (userType === 'painter') {
                dashboardUrl = 'painter/painter_dashboard.html';
            } else if (userType === 'admin') {
                dashboardUrl = 'admin/admin_dashboard.html';
            } else {
                alert('Please select a valid user type.');
                return;
            }

            alert(`Logged in as a ${userType}. Redirecting to dashboard...`);
            window.location.href = dashboardUrl;
        });
    </script>
</body>
</html>
